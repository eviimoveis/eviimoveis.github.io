# Apaga automaticamente as páginas de imóveis vencidas.
# Cada página de imóvel fica numa pasta própria (ex.: /pinheiros) com um arquivo
# expira.txt contendo a data de validade (AAAA-MM-DD). Uma vez por semana,
# esta rotina apaga as pastas cuja data já passou. O resto do site não é tocado.
name: Limpar imóveis vencidos

on:
  schedule:
    - cron: "17 12 * * 1"   # toda segunda-feira, ~9h (horário de Brasília)
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover pastas com expira.txt vencido
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%F)
          removidos=""
          for f in */expira.txt; do
            [ -f "$f" ] || continue
            pasta=$(dirname "$f")
            data=$(tr -d '[:space:]' < "$f")
            if [[ "$data" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$data" < "$hoje" ]]; then
              git rm -r -q "$pasta"
              removidos="$removidos $pasta"
            fi
          done
          if [ -n "$removidos" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove imóveis vencidos:$removidos"
            git push
          else
            echo "Nenhum imóvel vencido."
          fi
